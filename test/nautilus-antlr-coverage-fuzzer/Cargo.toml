[package]
name = "nautilus-antlr-coverage-fuzzer"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
libafl = { version = "0.16", default-features = false, features = ["std", "nautilus_py"] }
libafl_bolts = "0.16"
ratatui = "0.30.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
