[project]
name = "babel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "antlr4-python3-runtime>=4.13.2",
    "hatchling>=1.32.0",
]

[tool.uv.workspace]
members = ["packages/*", "translators/*"]

[build-system]
requires = ["hatchling"]
build-backend="hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hooks/init_antlr.py"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/*", "translators/*"]

[project.scripts]
babel-cli = "babel_cli:main"